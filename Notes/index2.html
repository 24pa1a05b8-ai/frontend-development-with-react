<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 p-4 p-md-5">
                    <h1 class="text-center mb-4">Notes Application</h1>
                    <p class="text-center text-muted mb-4">Write, save, and manage your notes locally in your browser.</p>

                    <form id="noteForm" class="mb-4">
                        <div class="input-group input-group-lg">
                            <input id="noteInput" class="form-control" type="text" placeholder="Type a note..." autocomplete="off">
                            <button class="btn btn-primary" type="submit">Add Note</button>
                        </div>
                    </form>

                    <div id="emptyState" class="empty-state">
                        <h5>No notes yet</h5>
                        <p class="mb-0">Add your first note to get started.</p>
                    </div>

                    <div id="noteList" class="row g-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
