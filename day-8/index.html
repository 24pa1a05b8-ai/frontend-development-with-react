<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student grade calculator</title>
</head>
<body>
    <script>
        

        function getValues(){
            var value1 = parseInt(prompt("Enter first number:"));
            var value2 = parseInt(prompt("Enter second number:"));
            if(isNaN(value1) || isNaN(value2)){
                alert("Please enter valid numbers.");
                return null;
            }
            return {value1, value2};
        }
        function add(){
            var numbers = getValues();
            if(numbers == null){
                return;
            }
            var sum = numbers.value1 + numbers.value2;
            alert("Sum: " + sum);
        }
        function subtract(){
            var numbers = getValues();
            if(numbers == null){
                return;
            }
            var difference = numbers.value1 - numbers.value2;
            alert("Difference: " + difference);
        }
        function multiply(){
            var numbers = getValues();
            if(numbers == null){
                return;
            }
            var product = numbers.value1 * numbers.value2;
            alert("Product: " + product);
        }
        function divide(){
            var numbers = getValues();
            if(numbers == null){
                return;
            }
            if(numbers.value2 === 0){
                alert("Cannot divide by zero.");
                return;
            }
            var quotient = numbers.value1 / numbers.value2;
            alert("Quotient: " + quotient);
        }
        function modulus(){
            var numbers = getValues();
            if(numbers == null){
                return;
            }
            if(numbers.value2 === 0){
                alert("Cannot perform modulus by zero.");
                return;
            }
            var mod = numbers.value1 % numbers.value2;
            alert("Modulus: " + mod);
        }

    </script>
</body>
</html>
