<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double each number</title>
</head>
<body>
    <script>
        
        let num = [1, 2, 3, 4, 5];
        let doubledNumbers = num.map(n => n * 2);
    
        console.log(doubledNumbers);
        document.write("Original numbers: " + num + "<br>");
        document.write("Doubled numbers: " + doubledNumbers);
    </script>
</body>
</html>
