<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 digit number or not</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number to check whether it is a 3-digit number or not:");
        if(num >= 100 && num <= 999){
            alert(num + " is a 3-digit number");
        }
        else{
            alert(num + " is not a 3-digit number");
        }
    </script>
</body>
</html>
