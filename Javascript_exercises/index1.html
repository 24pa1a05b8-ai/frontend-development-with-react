<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divisible by 7</title>
</head>
<script>
    let num = prompt("Enter a number:");
    if (num % 7 === 0) {
        alert(num + " is divisible by 7.");
    } else {
        alert(num + " is not divisible by 7.");
    }
</script>

</body>
</html>
