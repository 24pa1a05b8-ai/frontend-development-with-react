<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checking a number is a factor of 84</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number:");
        if (84 % num === 0) {
            alert(num + " is a factor of 84.");
        } else {
            alert(num + " is not a factor of 84.");
        }
    </script>
</body>
</html>
