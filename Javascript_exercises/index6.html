<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Units Place is 4 or not</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number to check whether it has 4 at units place:");
        if(num % 10 == 4){
            alert("Your number has 4 at units place")
        }
        else{
            alert("Your number does not have 4 at units place");
        }
    </script>
</body>
</html>
