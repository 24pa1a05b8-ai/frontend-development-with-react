<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if a number is positive or negative</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number to check whether it is positive or negative:");
        num > 0 ? alert(num + " is a positive number") : alert(num + " is a negative number");
    </script>
</body>
</html>
