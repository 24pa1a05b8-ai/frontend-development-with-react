<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>check if a number is fac of 96 or not</title>
</head>
<body>
    <script>
        let num =prompt("Enter a number:");
        if(num>96) {
            alert("Input is not valid as it is greater than 96");
        }
        else{
            if(96%num == 0){
                alert(num + " is a factor of 96");
            }
            else{
                alert(num + " is not a factor of 96");
            }
        }
    </script>
</body>
</html>
