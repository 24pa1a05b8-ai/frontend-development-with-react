<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>print a number is even or not</title>
</head>
<body>
    <script>
        let num = prompt("Enter a number:");
        num % 2 ==0 ? alert("it is an even number") : alert("It is odd number");
    </script>
</body>
</html>
