<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a href="app.html" class="navbar-brand">
            <i class="bi bi-shop"></i> ShopEasy
        </a>

        <a href="app.html" class="btn btn-outline-light">
            <i class="bi bi-house"></i> Home
        </a>
    </div>
</nav>

<!-- Wishlist Heading -->
<div class="container mt-4">

    <h2 class="text-center mb-4">
        <i class="bi bi-heart-fill text-danger"></i>
        My Wishlist
    </h2>

    <!-- Products will appear here -->
    <div class="row" id="wishlistItems"></div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

let output = "";

if(wishlist.length === 0){

    output = `
        <div class="col-12 text-center">
            <h4>Your Wishlist is Empty ❤️</h4>
            <a href="app.html" class="btn btn-primary mt-3">
                Continue Shopping
            </a>
        </div>
    `;

}
else{

    wishlist.forEach((item,index)=>{

        output += `

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img src="${item.image}" class="card-img-top">

                <div class="card-body text-center">

                    <h5>${item.name}</h5>

                    <p class="fw-bold">₹${item.price}</p>

                    <button class="btn btn-success">
                        <i class="bi bi-cart-plus"></i>
                        Add to Cart
                    </button>

                    <button class="btn btn-danger mt-2"
                    onclick="removeItem(${index})">

                        <i class="bi bi-trash"></i>
                        Remove

                    </button>

                </div>

            </div>

        </div>

        `;

    });

}

document.getElementById("wishlistItems").innerHTML = output;

function removeItem(index){

    wishlist.splice(index,1);

    localStorage.setItem("wishlist",JSON.stringify(wishlist));

    location.reload();

}

</script>

</body>
</html>
