<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form</title>
    <style>
        .feedback{
            border: 1px solid black;
            margin: 100px auto;
            width:500px;
            align-items:center;
            text-align:center;
            padding:20px;
        }
    </style>
</head>
<body>
    <div class="feedback">
        <h2>Feedback Form</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="username" required><br>

            <label for="gender">Gender:</label>
            <label for="male"><input type="radio" id="male" name="gender" value="male" required> Male</label>
            <label for="female"><input type="radio" id="female" name="gender" value="female" required> Female</label><br>

            <label for="age">Age:</label>
            <input type="number" id="age" required><br>

            <label for="doctor">choose the doctor you visited</label>
            <select id="doctor" name="doctor" required>
                <option value="gynocologist">Gynocologist</option>
                <option value="neurologist">Neurologist</option>
                <option value="cardiologist">Cardiologist</option>
            </select><br>

            <label for="feedback">Feedback</label><br>
            <textarea id="feedback" name ="feedback" rows="4" cols="20" placeholder="Please provide your feedback here..." required></textarea>
            
        </form>
    </div>
</body>
</html>
