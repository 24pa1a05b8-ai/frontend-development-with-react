<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converting to uppercase</title>
</head>
<body>
    <script>
        let words = ["sri", "vyshnavi", "kollipara"];
        let uppercaseWords = words.map(word => word.toUpperCase());
        console.log(uppercaseWords);
        document.write("Original words: " + words + "<br>");
        document.write("Uppercase words: " + uppercaseWords);
    </script>
</body>
</html>
