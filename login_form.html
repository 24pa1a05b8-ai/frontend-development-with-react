<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        .login h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .login input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="login">
        <h2>Login</h2>
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter your name" required>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" minlength="6" maxlength="100" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
