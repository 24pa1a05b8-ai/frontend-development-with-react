<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <style>

        body {
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        div{
            border: 2px solid black;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            background-color: #bfc6e3;
        }
        div img{
            border-radius: 50%;
            border: 2px solid black;
        }

        P:hover{
            color: blue;
        }
    </style>
</head>
<body>
    <div>
        <h1> Student Profile</h1>
        <img src="PHOTOO.jpeg" alt="Profile Photo" width="200">
        <p><b>Name:</b> Kollipara Sri Vyshnavi</p>
        <p><b>Course:</b> Computer Science</p>
        <p><b>2024-2028</b></p>
    </div>
</body>
</html>
